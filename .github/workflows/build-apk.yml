name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-unpack ZIP & locate Flutter project root
        id: locate
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" -d .
            fi
          fi
          PUBSPEC_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Ensure Gradle wrapper binaries exist
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ ! -f "android/gradlew" ]; then
            flutter create . --platforms=android,ios --org com.example --project-name fast_video_compressor
          fi
          chmod +x android/gradlew || true

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter pub get

      - name: Build Split Release APK (ARM64)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release --split-per-abi

      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-video-compressor-arm64-apk
          path: ${{ steps.locate.outputs.dir }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
