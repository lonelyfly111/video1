name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Unpack ZIP & Rebuild Native AGP 9.0 Android Scaffold
        id: locate
        run: |
          # 1. 解压仓库中的 .zip（排除 .github 目录）
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -x ".github/*" -d . || unzip -o "$ZIP_FILE" -d .
          fi

          # 2. 定位工程根目录
          PUBSPEC_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1)
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

          # 3. 兼容修复旧版 ZIP 中的 Dart 图标常量与属性名
          sed -i 's/Icons.AutoAwesome_rounded/Icons.auto_awesome_rounded/g' "$PROJECT_DIR"/lib/screens/*.dart || true
          sed -i 's/Icons.video_Call_rounded/Icons.video_call_rounded/g' "$PROJECT_DIR"/lib/screens/*.dart || true
          sed -i 's/activeThumbColor:/activeColor:/g' "$PROJECT_DIR"/lib/screens/*.dart || true

          # 4. 使用云端当前 Flutter SDK 生成 100% 兼容 AGP 9.0 的全新 Android 原生脚手架
          rm -rf /tmp/flutter_scaffold
          flutter create /tmp/flutter_scaffold --platforms=android --org com.example --project-name fast_video_compressor

          # 5. 将工程原有的 Kotlin 硬件编码源码与 AndroidManifest、图标备份后，整体采用云端原生 Gradle 模板
          mkdir -p /tmp/backup_src
          cp -r "$PROJECT_DIR/android/app/src/main/kotlin" /tmp/backup_src/
          cp -f "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml" /tmp/backup_src/AndroidManifest.xml
          cp -r "$PROJECT_DIR/android/app/src/main/res/mipmap-"* /tmp/backup_src/ 2>/dev/null || true

          # 用云端最新 AGP 9.0 标准 android 目录整体替换，彻底消除所有 Gradle DSL 语法冲突
          rm -rf "$PROJECT_DIR/android"
          cp -r /tmp/flutter_scaffold/android "$PROJECT_DIR/android"

          # 恢复我们的 MediaCodec + OpenGL ES 硬件加速源码、权限配置与图标
          rm -rf "$PROJECT_DIR/android/app/src/main/kotlin"
          cp -r /tmp/backup_src/kotlin "$PROJECT_DIR/android/app/src/main/"
          cp -f /tmp/backup_src/AndroidManifest.xml "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          sed -i 's/package="com.example.fast_video_compressor"//g' "$PROJECT_DIR/android/app/src/main/AndroidManifest.xml" || true
          cp -r /tmp/backup_src/mipmap-* "$PROJECT_DIR/android/app/src/main/res/" 2>/dev/null || true

          # 6. 在云端原生生成的 app/build.gradle.kts 中注入 minSdk = 24、targetSdk = 35 与协程依赖
          APP_GRADLE="$PROJECT_DIR/android/app/build.gradle.kts"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' "$APP_GRADLE" || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' "$APP_GRADLE" || true
          cat >> "$APP_GRADLE" << 'EOF'

          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat "$APP_GRADLE"
          chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter pub get

      - name: Build Split Release APK (ARM64)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release --split-per-abi

      - name: Upload ARM64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-video-compressor-arm64-apk
          path: ${{ steps.locate.outputs.dir }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
